version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Starting AWS Amplify build for Plataforma de Cobrança"
        - node --version
        - npm --version
        - npm ci --legacy-peer-deps
    build:
      commands:
        - echo "Building React frontend with Vite"
        - npm run build
        - echo "Build completed successfully"
        - echo "Checking frontend build output:"
        - ls -la client/dist/
  artifacts:
    baseDirectory: client/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*